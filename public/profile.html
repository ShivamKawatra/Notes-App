<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — NotesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { overflow: auto; height: auto; min-height: 100vh; }
    .profile-main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 48px 20px 60px; gap: 24px;
    }
    .profile-card, .edit-card, .stats-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 36px; width: 100%; max-width: 520px;
    }
    /* Avatar */
    .avatar-wrap { position: relative; width: 80px; height: 80px; margin-bottom: 20px; cursor: pointer; }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #c084fc);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: #fff;
      overflow: hidden; object-fit: cover;
    }
    .avatar-wrap img.profile-avatar { display: block; }
    .avatar-overlay {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center;
      justify-content: center; opacity: 0; transition: opacity 0.18s;
      font-size: 1.2rem;
    }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }
    #avatarInput { display: none; }

    .profile-name { font-size: 1.5rem; font-weight: 800; color: var(--text-1); letter-spacing: -0.02em; margin-bottom: 4px; }
    .profile-email { font-size: 0.88rem; color: var(--text-2); margin-bottom: 24px; }
    .profile-meta { display: flex; gap: 24px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--border); }
    .meta-item { display: flex; flex-direction: column; gap: 3px; }
    .meta-label { font-size: 0.7rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; }
    .meta-value { font-size: 1rem; font-weight: 700; color: var(--text-1); }
    .profile-actions { display: flex; gap: 10px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }

    /* Stats */
    .stats-title { font-size: 0.72rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 18px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 0.72rem; font-weight: 500; color: var(--text-3); margin-top: 2px; }
    .cat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .cat-chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; font-weight: 600; color: var(--accent);
    }
    .cat-chip span { color: var(--text-2); font-weight: 400; }
    .recent-list { display: flex; flex-direction: column; gap: 8px; }
    .recent-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.84rem;
    }
    .recent-title { font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    .recent-date { font-size: 0.72rem; color: var(--text-3); flex-shrink: 0; }
    .section-divider { font-size: 0.72rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">📝 NotesApp</a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">📝 My Notes</a>
      <a href="/profile.html" class="nav-link active">👤 Profile</a>
      <button class="nav-link nav-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </nav>

  <main class="profile-main">

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="avatar-wrap" id="avatarWrap" title="Click to change photo">
        <div class="profile-avatar" id="avatarEl">?</div>
        <div class="avatar-overlay">📷</div>
        <input type="file" id="avatarInput" accept=".png,.jpg,.jpeg"/>
      </div>
      <div class="profile-name" id="profileName">Loading…</div>
      <div class="profile-email" id="profileEmail"></div>
      <div class="profile-meta">
        <div class="meta-item">
          <span class="meta-label">Member since</span>
          <span class="meta-value" id="memberSince">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Account ID</span>
          <span class="meta-value" id="accountId">—</span>
        </div>
      </div>
      <div class="profile-actions">
        <a href="/settings.html" class="btn-primary">⚙️ Settings</a>
        <button class="btn-danger" id="logoutBtn2">🚪 Sign Out</button>
      </div>
    </div>

    <!-- Stats Card -->
    <div class="stats-card">
      <div class="stats-title">Your Notes Overview</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num" id="totalNotes">—</div><div class="stat-lbl">Total Notes</div></div>
        <div class="stat-box"><div class="stat-num" id="totalCats">—</div><div class="stat-lbl">Categories</div></div>
        <div class="stat-box"><div class="stat-num" id="topCat">—</div><div class="stat-lbl">Top Category</div></div>
      </div>
      <div class="section-divider">Categories</div>
      <div class="cat-list" id="catList"></div>
      <div class="section-divider">Recent Activity</div>
      <div class="recent-list" id="recentList"></div>
    </div>

  </main>

  <footer class="footer">
    <span>© 2026 NotesApp — Built with Node.js, Express.js &amp; MongoDB</span>
    <a href="/dashboard" class="footer-home">📝 My Notes</a>
  </footer>

  <script>
    const fmtDate = dt => new Date(dt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const $ = id => document.getElementById(id);

    function setMsg(id, text, ok) {
      const el = $(id);
      el.textContent = text;
      el.className = 'edit-msg ' + (ok ? 'ok' : 'err');
      if (ok) setTimeout(() => el.textContent = '', 3000);
    }

    function setAvatar(src) {
      const el = $('avatarEl');
      el.outerHTML = `<img class="profile-avatar" id="avatarEl" src="${src}" alt="avatar"/>`;
    }

    async function init() {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.replace('/login.html'); return; }
      const user = await res.json();

      $('profileName').textContent = user.name;
      $('profileEmail').textContent = user.email;
      $('memberSince').textContent = user.created_at ? fmtDate(user.created_at) : '—';
      $('accountId').textContent = `#${user.id}`;
      if (user.avatar) {
        setAvatar(user.avatar);
      } else {
        $('avatarEl').textContent = user.name.charAt(0).toUpperCase();
      }

      const statsRes = await fetch('/api/me/stats');
      const stats = await statsRes.json();
      $('totalNotes').textContent = stats.total;
      $('totalCats').textContent = stats.categories.length;
      $('topCat').textContent = stats.categories[0]?.category || '—';

      const catList = $('catList');
      catList.innerHTML = stats.categories.length
        ? stats.categories.map(c => `<div class="cat-chip">${c.category} <span>${c.c} note${c.c !== 1 ? 's' : ''}</span></div>`).join('')
        : '<span style="color:var(--text-3);font-size:0.82rem">No notes yet</span>';

      const recentList = $('recentList');
      recentList.innerHTML = stats.recent.length
        ? stats.recent.map(n => `<div class="recent-item"><span class="recent-title">${n.title}</span><span class="recent-date">${fmtDate(n.updated_at)}</span></div>`).join('')
        : '<span style="color:var(--text-3);font-size:0.82rem">No recent activity</span>';
    }

    // Avatar upload
    $('avatarWrap').addEventListener('click', () => $('avatarInput').click());
    $('avatarInput').addEventListener('change', async () => {
      const file = $('avatarInput').files[0];
      if (!file) return;
      const form = new FormData();
      form.append('avatar', file);
      const res = await fetch('/api/me/avatar', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) return alert(data.error);
      setAvatar(data.avatar);
    });

    async function logout() {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      window.location.replace('/login.html');
    }
    $('logoutBtn').addEventListener('click', logout);
    $('logoutBtn2').addEventListener('click', logout);

    init();
  </script>
</body>
</html>
